openapi: 3.1.0
info:
  title: FMR Mock API
  description: '

    Mock of the **FMR** APIs used by the Meitav Trade agent for **password reset**
    and **username recovery**.


    **Authorize first:** click **Authorize** and paste the API key (`MOCK_API_KEY`).


    ### Flow

    1. `ValidateExToken`: get `RequestID` + `RToken`

    2. `AccountVerification`: verify the 6-digit trade account, get the cards

    3. `ResetPassword` (→ 210, SMS) or `RecoverUserID` (→ 209, email) with `UserId`
    = card''s last 3 digits


    ### Test accounts

    | Account | Cards | Result |

    |---|---|---|

    | `001234` | 771 | Happy path (one card) |

    | `012345` | 025, 418 | Two cards: customer picks |

    | `054321` | 309 | RecoverUserID → **427** (no email) |

    | `067890` | 552 (inactive), 860 | 552 → **436** |

    | `098765` | 144 | TIK = Y (managed account) |

    | any other | – | **404**, 3 attempts then **423** |


    ### Bank details (instead of `Account`)

    | Bank / Branch / Account | Trade account | Result |

    |---|---|---|

    | `012` / `600` / `123456` | 001234 | One card (771) |

    | `010` / `800` / `554433` | 012345 | Two cards (025, 418) |

    | `020` / `456` / `98765` | 054321 | No email (RecoverUserID → 427) |

    | `011` / `042` / `777888` | 067890 | 552 inactive, 860 |

    | `031` / `123` / `112233` | 054321 **and** 067890 | **418** (joint bank account)
    |

    | any other full set | – | **404**, 2 attempts then **423** |

    | only 1–2 bank fields | – | **434** |

    | `Account` + bank fields | – | **435** |


    ### Forms

    `POST /api/formemail/send-form-by-email` emails a filled form (`formName`: `kubiot`
    or `nispah5`).

    Any recipient works; `@fail.com` / `@error.com` → **500**.


    ### Status codes

    By default the HTTP status equals the FMR `Status` (e.g. 210, 436). If the server
    runs with

    `FMR_STATUS_IN_HTTP=false`, every response is HTTP 200 and the code is only in
    `Status`.


    Only **209, 210, 427, 433, 436** come from the spec; other error codes are placeholders
    until FMR confirms them.

    '
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Mock helpers
      summary: Health check (no API key)
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ValidateExToken:
    post:
      tags:
      - FMR
      summary: Validate the MToken and open an FMR session
      description: Returns the RequestID + RToken used on every later call. They don't
        expire.
      operationId: validate_ex_token_ValidateExToken_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateExTokenIn'
            examples:
              success:
                summary: Successful validation
                value:
                  ExSessionID: test-1
                  MToken: eyJ.mock
              failed:
                summary: Failed login (401)
                value:
                  ExSessionID: test-1
                  MToken: invalid
        required: true
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 400
                Error: BAD_REQUEST
                Message: Invalid or missing fields
                Fields:
                - RToken
        '401':
          description: INVALID_MTOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 401
                Error: INVALID_MTOKEN
                Message: MToken rejected (invalid)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /AccountVerification:
    post:
      tags:
      - FMR
      summary: Verify the customer by trade account OR bank details
      description: 'Send **either** `Account` (6 digits) **or** all three bank fields
        `Bank` + `BankBranch` + `BankAccount`.


        Trade account and bank details have separate attempt counters per RequestID
        (`MAX_VERIFY_ATTEMPTS`, `MAX_BANK_ATTEMPTS`).'
      operationId: account_verification_AccountVerification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountVerificationIn'
            examples:
              account:
                summary: By trade account
                value:
                  RequestID: <RequestID>
                  RToken: <RToken>
                  Account: '012345'
              bank:
                summary: By bank details
                value:
                  RequestID: <RequestID>
                  RToken: <RToken>
                  Bank: '012'
                  BankBranch: '600'
                  BankAccount: '123456'
        required: true
      responses:
        '200':
          description: Customer identified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationOut'
        '400':
          description: INVALID_ACCOUNT_FORMAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 400
                Error: INVALID_ACCOUNT_FORMAT
                Message: Account must be exactly 6 digits
        '401':
          description: INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 401
                Error: INVALID_TOKEN
                Message: RequestID/RToken not recognised
        '404':
          description: ACCOUNT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 404
                Error: ACCOUNT_NOT_FOUND
                Message: Account does not match the authenticated customer
                AttemptsLeft: 2
        '418':
          description: BANK_DETAILS_MULTIPLE_ACCOUNTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 418
                Error: BANK_DETAILS_MULTIPLE_ACCOUNTS
                Message: Bank details match more than one trade account
        '423':
          description: TOO_MANY_ATTEMPTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 423
                Error: TOO_MANY_ATTEMPTS
                Message: Maximum verification attempts reached
                AttemptsLeft: 0
        '434':
          description: PARTIAL_BANK_DETAILS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 434
                Error: PARTIAL_BANK_DETAILS
                Message: Bank, BankBranch and BankAccount are all required
        '435':
          description: ACCOUNT_AND_BANK_DETAILS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 435
                Error: ACCOUNT_AND_BANK_DETAILS
                Message: Send either the trade account or the bank details, not both
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /ResetPassword:
    post:
      tags:
      - FMR
      summary: Send the password-reset SMS
      operationId: reset_password_ResetPassword_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '210':
          description: SMS sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
              example:
                Status: 210
                Message: Password reset SMS sent to the verified phone number
        '400':
          description: CARD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 400
                Error: CARD_NOT_FOUND
                Message: UserId does not match a card on this account
        '401':
          description: INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 401
                Error: INVALID_TOKEN
                Message: RequestID/RToken not recognised
        '433':
          description: NOT_IDENTIFIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 433
                Error: NOT_IDENTIFIED
                Message: Customer not identified by trade account or bank details
        '436':
          description: CARD_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 436
                Error: CARD_NOT_ACTIVE
                Message: Selected card is not active
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /RecoverUserID:
    post:
      tags:
      - FMR
      summary: Send the username-recovery email
      operationId: recover_user_id_RecoverUserID_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '209':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
              example:
                Status: 209
                Message: Username recovery email sent
        '400':
          description: CARD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 400
                Error: CARD_NOT_FOUND
                Message: UserId does not match a card on this account
        '401':
          description: INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 401
                Error: INVALID_TOKEN
                Message: RequestID/RToken not recognised
        '433':
          description: NOT_IDENTIFIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 433
                Error: NOT_IDENTIFIED
                Message: Customer not identified by trade account or bank details
        '427':
          description: NO_EMAIL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 427
                Error: NO_EMAIL
                Message: No email on account; username cannot be sent
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/formemail/send-form-by-email:
    post:
      tags:
      - Forms
      summary: Email a filled form to the customer
      description: 'Mock of Meitav''s `chat-integration-api` `send-form-by-email`.
        Pick the `data` shape with `formName`: **kubiot** (pension enrolment) or **nispah5**
        (נספח ה''). No RequestID/RToken needed. The real API also wants the customer''s
        bearer token and the IBM gateway headers `x-ibm-client-id` / `x-ibm-client-secret`;
        the mock ignores all three.


        Any email works, except one at `@fail.com` or `@error.com`, which returns
        500 `FORM_SEND_FAILED`. Unknown `formName` or missing `data` fields return
        400.'
      operationId: send_form_by_email_api_formemail_send_form_by_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFormIn'
            examples:
              kubiot:
                summary: 'kubiot: two products (200)'
                value:
                  email: customer@example.com
                  formName: kubiot
                  data:
                    new_filldate: 20/11/2025
                    fullName: ישראל ישראלי
                    idNumber: 012345678
                    employeName: מיטב
                    HP: '516583036'
                    monthlyIncome: 3,000
                    product: פנסיה מקיפה
                    salaryCategory: משכורת בסיסית
                    ma: '163'
                    ddovedPayment: 6%
                    ddcompensation: 6%
                    ddmaasikPayment: 6.5%
                    insureIncome: 2,000
                    product2: השתלמות
                    salaryCategory2: משכורת בסיסית
                    ma2: '880'
                    ddovedPayment2: 2.5%
                    ddmaasikPayment2: 7.5%
                    insureIncome2: 3,000
              nispah5:
                summary: nispah5 (200)
                value:
                  email: customer@example.com
                  formName: nispah5
                  data:
                    emploeeName: ישראל ישראלי
                    idNumber: 012345678
                    maasikName: מיטב
                    HP: '516583036'
                    product: מיטב פנסיה מקיפה
                    accountNum: 18-012345678
              failed:
                summary: Send failed (500)
                value:
                  email: customer@fail.com
                  formName: nispah5
                  data:
                    emploeeName: ישראל ישראלי
                    idNumber: 012345678
                    maasikName: מיטב
                    HP: '516583036'
                    product: מיטב פנסיה מקיפה
                    accountNum: 18-012345678
        required: true
      responses:
        '200':
          description: Form emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFormOut'
              example:
                Status: 200
                Message: Form sent by email
                FormName: kubiot
                ReferenceID: 6f1c…
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 400
                Error: BAD_REQUEST
                Message: Invalid or missing fields
                Fields:
                - data.HP
        '500':
          description: FORM_SEND_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              example:
                Status: 500
                Error: FORM_SEND_FAILED
                Message: Form could not be sent
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /mock/accounts:
    get:
      tags:
      - Mock helpers
      summary: List test accounts
      operationId: mock_accounts_mock_accounts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mock Accounts Mock Accounts Get
      security:
      - APIKeyHeader: []
  /mock/outbox:
    get:
      tags:
      - Mock helpers
      summary: SMS / emails sent so far
      operationId: mock_outbox_mock_outbox_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mock Outbox Mock Outbox Get
      security:
      - APIKeyHeader: []
  /mock/reset:
    post:
      tags:
      - Mock helpers
      summary: Clear sessions and outbox
      operationId: mock_reset_mock_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mock Reset Mock Reset Post
      security:
      - APIKeyHeader: []
  /test/push-session:
    post:
      tags:
      - Mock helpers
      summary: 'TEST: authenticate the customer (mock Commbox/Meitav creates the MToken
        and pushes it back)'
      operationId: push_session_test_push_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSessionIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Push Session Test Push Session Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /test/push-log:
    get:
      tags:
      - Mock helpers
      summary: 'TEST: results of the session callbacks'
      operationId: push_log_test_push_log_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Push Log Test Push Log Get
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ValidateExToken:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Validate the external session token (HTTP status = Status)
      operationId: validate_ex_token_api_ExternalProvider_ValidateExToken_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ExSessionID:
                  type: string
                  maxLength: 50
                  minLength: 1
                  title: Exsessionid
                mjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Mjwttoken
                  description: Any value works. `invalid`/`expired` → 400, `active-request`
                    → 430, `duplicate` → 432, `no-card` → 436.
              type: object
              required:
              - ExSessionID
              - mjwtToken
              title: ValidateExRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/AccountVerification:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Verify by trade account OR bank details (returns an array)
      operationId: account_verification_api_ExternalProvider_AccountVerification_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                Account:
                  anyOf:
                  - type: string
                    maxLength: 10
                  - type: 'null'
                  title: Account
                  examples:
                  - '012345'
                Bank:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Bank
                  examples:
                  - '012'
                Branch:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Branch
                  examples:
                  - '600'
                BankAccount:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Bankaccount
                  examples:
                  - '123456'
              type: object
              required:
              - RequestID
              - rjwtToken
              title: AccountVerificationRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ResetPassword:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Request a password-reset deep link
      operationId: reset_password_api_ExternalProvider_ResetPassword_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                SubCard:
                  type: string
                  maxLength: 3
                  minLength: 3
                  title: Subcard
                  examples:
                  - '418'
              type: object
              required:
              - RequestID
              - rjwtToken
              - SubCard
              title: SubCardRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ResetPasswordCard:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Resolve a password-reset deep link to a card
      operationId: reset_password_card_api_ExternalProvider_ResetPasswordCard_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                DeeplinkID:
                  type: string
                  title: Deeplinkid
              type: object
              required:
              - RequestID
              - rjwtToken
              - DeeplinkID
              title: ResetPasswordCardRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ForgotUsername:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Request username recovery through a secure message
      operationId: forgot_username_api_ExternalProvider_ForgotUsername_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                SubCard:
                  type: string
                  maxLength: 3
                  minLength: 3
                  title: Subcard
                  examples:
                  - '418'
              type: object
              required:
              - RequestID
              - rjwtToken
              - SubCard
              title: SubCardRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/SecureMessage/{token}:
    get:
      tags:
      - FMR (Swagger v1)
      summary: Secure message unlock form (HTML)
      operationId: secure_message_api_ExternalProvider_SecureMessage__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/ExternalProvider/SecureMessage/{token}/Unlock:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Unlock the secure message with the client ID number (HTML)
      operationId: unlock_api_ExternalProvider_SecureMessage__token__Unlock_post
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AccountVerificationIn:
      properties:
        RequestID:
          type: string
          title: Requestid
          description: From ValidateExToken
        RToken:
          type: string
          title: Rtoken
          description: From ValidateExToken
        Account:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
          description: Trade account number, exactly 6 digits (pad with leading zeros)
          examples:
          - '012345'
        Bank:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Bank
          description: Bank number, up to 3 digits
          examples:
          - '012'
        BankBranch:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Bankbranch
          description: Branch number, up to 3 digits
          examples:
          - '600'
        BankAccount:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Bankaccount
          description: Bank account number, up to 9 digits
          examples:
          - '123456'
      type: object
      required:
      - RequestID
      - RToken
      title: AccountVerificationIn
      description: Send EITHER the trade account number OR all three bank (עו"ש) fields,
        never both.
    ActionIn:
      properties:
        RequestID:
          type: string
          title: Requestid
          description: From ValidateExToken
        RToken:
          type: string
          title: Rtoken
          description: From ValidateExToken
        UserId:
          type: string
          title: Userid
          description: Last 3 digits of the selected card
          examples:
          - '418'
      type: object
      required:
      - RequestID
      - RToken
      - UserId
      title: ActionIn
    ActionOut:
      properties:
        Status:
          type: integer
          title: Status
