openapi: 3.1.0
info:
  title: FMR Mock API
  description: '

    Mock of the **FMR** APIs used by the Meitav Trade agent for **password reset**
    and **username recovery**,

    shaped like FMR''s Swagger v1 (`/api/ExternalProvider/*`).


    **Authorize first:** click **Authorize** and paste the API key (`MOCK_API_KEY`).


    ### Flow

    1. `ValidateExToken`: get `RequestID` + `rjwtToken`

    2. `AccountVerification`: verify the 6-digit trade account (or bank details),
    get the cards

    3. `ResetPassword` (→ 210, deep link) or `ForgotUsername` (→ 209, secure message)
    with `SubCard` = card''s last 3 digits


    ### Test accounts

    | Account | Cards | Result |

    |---|---|---|

    | `001234` | 771 | Happy path (one card) |

    | `012345` | 025, 418 | Two cards: customer picks |

    | `054321` | 309 | ForgotUsername → **427** (no email) |

    | `067890` | 552 (inactive), 860 | 552 → **436** |

    | `098765` | 144 | Tik = Y (managed account) |

    | any other | – | **404** (HTTP 401), 3 attempts then **423** |


    ### Bank details (instead of `Account`)

    | Bank / Branch / BankAccount | Trade account | Result |

    |---|---|---|

    | `012` / `600` / `123456` | 001234 | One card (771) |

    | `010` / `800` / `554433` | 012345 | Two cards (025, 418) |

    | `020` / `456` / `98765` | 054321 | No email (ForgotUsername → 427) |

    | `011` / `042` / `777888` | 067890 | 552 inactive, 860 |

    | `031` / `123` / `112233` | 054321 **and** 067890 | **418** (joint bank account)
    |

    | any other full set | – | **404**, 2 attempts then **423** |

    | only 1–2 bank fields | – | **434** |

    | `Account` + bank fields | – | **435** |

    '
  version: 1.0.0
paths:
  /api/ExternalProvider/ValidateExToken:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Validate the external session token (HTTP status = Status)
      operationId: validate_ex_token_api_ExternalProvider_ValidateExToken_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ExSessionID:
                  type: string
                  maxLength: 50
                  minLength: 1
                  title: Exsessionid
                mjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Mjwttoken
                  description: Any value works. `invalid`/`expired` → 400, `active-request`
                    → 430, `duplicate` → 432, `no-card` → 436.
              type: object
              required:
              - ExSessionID
              - mjwtToken
              title: ValidateExRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/AccountVerification:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Verify by trade account OR bank details (returns an array)
      operationId: account_verification_api_ExternalProvider_AccountVerification_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                Account:
                  anyOf:
                  - type: string
                    maxLength: 10
                  - type: 'null'
                  title: Account
                  examples:
                  - '012345'
                Bank:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Bank
                  examples:
                  - '012'
                Branch:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Branch
                  examples:
                  - '600'
                BankAccount:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: 'null'
                  title: Bankaccount
                  examples:
                  - '123456'
              type: object
              required:
              - RequestID
              - rjwtToken
              title: AccountVerificationRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ResetPassword:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Request a password-reset deep link
      operationId: reset_password_api_ExternalProvider_ResetPassword_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                SubCard:
                  type: string
                  maxLength: 3
                  minLength: 3
                  title: Subcard
                  examples:
                  - '418'
              type: object
              required:
              - RequestID
              - rjwtToken
              - SubCard
              title: SubCardRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/ExternalProvider/ForgotUsername:
    post:
      tags:
      - FMR (Swagger v1)
      summary: Request username recovery through a secure message
      operationId: forgot_username_api_ExternalProvider_ForgotUsername_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                RequestID:
                  type: string
                  title: Requestid
                rjwtToken:
                  type: string
                  maxLength: 16384
                  minLength: 1
                  title: Rjwttoken
                SubCard:
                  type: string
                  maxLength: 3
                  minLength: 3
                  title: Subcard
                  examples:
                  - '418'
              type: object
              required:
              - RequestID
              - rjwtToken
              - SubCard
              title: SubCardRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Value of `MOCK_API_KEY` (Render → Environment).
      in: header
      name: X-API-Key
